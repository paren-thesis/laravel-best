services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fyp_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "9000:9000"
    networks:
      - fyp_network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:1.25-alpine
    container_name: fyp_webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fyp_network
    depends_on:
      - app

  frontend:
    image: node:20-alpine
    container_name: fyp_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - fyp_network

  db:
    image: mysql:8.0
    container_name: fyp_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: fyp_db
      MYSQL_ROOT_PASSWORD: secret_root_password
      MYSQL_USER: fyp_user
      MYSQL_PASSWORD: secret_user_password
    volumes:
      - fyp_db_data:/var/lib/mysql
    networks:
      - fyp_network

  redis:
    image: redis:7-alpine
    container_name: fyp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - fyp_network

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fyp_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
    networks:
      - fyp_network
    depends_on:
      - app
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fyp_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    networks:
      - fyp_network
    depends_on:
      - app
      - db

  websockets:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: fyp_websockets
    restart: unless-stopped
    environment:
      SOKETI_DEBUG: "1"
      SOKETI_DEFAULT_APP_ID: "fyp_app_id"
      SOKETI_DEFAULT_APP_KEY: "fyp_app_key"
      SOKETI_DEFAULT_APP_SECRET: "fyp_app_secret"
    ports:
      - "6001:6001"
    networks:
      - fyp_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: fyp_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - fyp_network

networks:
  fyp_network:
    driver: bridge

volumes:
  fyp_db_data:
    driver: local
